[package]
name = "aide-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "AIDE — MCP server delivering IDE-grade code intelligence (LSP, SCIP, git, exec, DAP) to AI agents."

[[bin]]
name = "mcp-aide"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Jiri Vysoky <jiri.vysoky@gmail.com>"
copyright = "2026 Jiri Vysoky"
license-file = ["../../LICENSE", "0"]
extended-description = """\
aide-mcp is a headless Model Context Protocol server written in Rust that
exposes IDE-grade tools (LSP proxy, SCIP index, git read ops, project
exec/test/run, DAP debug, GitHub issue/PR workflow) to AI agents over stdio."""
section = "devel"
priority = "optional"
assets = [
    ["target/release/mcp-aide", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/mcp-aide/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/mcp-aide/LICENSE", "644"],
]

[dependencies]
aide-core.workspace = true
aide-dap.workspace = true
aide-git.workspace = true
aide-github.workspace = true
aide-install.workspace = true
aide-lang.workspace = true
aide-lsp.workspace = true
aide-proto.workspace = true
aide-scip.workspace = true
aide-search.workspace = true

anyhow.workspace = true
axum.workspace = true
clap.workspace = true
lsp-types.workspace = true
nix.workspace = true
regex.workspace = true
rmcp = { workspace = true }
sysinfo.workspace = true
schemars.workspace = true
serde = { workspace = true }
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true }
